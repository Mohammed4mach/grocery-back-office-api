name: .NET

on:
  pull_request:
    types:
      - closed
    branches: [production]
  workflow_dispatch:

jobs:
  build_deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish
      run: |
        dotnet publish grocery-back-office-api.fsproj\
          -c Release\
          -o ./publish\
          -r linux-x64\
          --self-contained true

    - name: Compress
      run: tar -cvzf publish.tar.gz publish

    - name: Deploy
      env:
        PRIVATE_KEY: ${{ secrets.SERVER_PRIVATE_KEY  }}
        HOST_NAME: ${{ secrets.HOST_NAME  }}
        USER_NAME: ${{ secrets.USER_NAME  }}

      run: |
        echo "$PRIVATE_KEY" > private_key && chmod 600 private_key

        ssh -o StrictHostKeyChecking=no -i private_key ${USER_NAME}@${HOST_NAME} '
        sudo supervisorctl stop grocery-back-office-api
        sudo rm -rf /var/www/grocery-back-office-api/*
        '

        scp -r -o StrictHostKeyChecking=no -i private_key\
          publish.tar.gz ${USER_NAME}@${HOST_NAME}:/var/www/grocery-back-office-api/

        ssh -o StrictHostKeyChecking=no -i private_key ${USER_NAME}@${HOST_NAME} '
        cd /var/www/grocery-back-office-api &&
        tar -xvzf publish.tar.gz &&
        mv publish/* ./ &&
        rm -rf publish.tar.gz &&

        sudo chown -R www-data:www-data /var/www/grocery-back-office-api &&
        sudo chmod -R 755 /var/www/grocery-back-office-api &&

        sudo supervisorctl reread &&
        sudo supervisorctl update &&
        sudo supervisorctl start grocery-back-office-api &&
        sudo systemctl restart nginx
        '

